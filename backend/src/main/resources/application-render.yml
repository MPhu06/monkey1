spring.application.name=slide-to-diagram

# Server
server.port=${PORT:8080}

# PostgreSQL (Render will set DATABASE_URL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS - cho phep Vercel frontend
app.cors.allowed-origins=${APP_CORS_ORIGINS:https://slide-to-diagram-frontend.vercel.app}

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:render}
