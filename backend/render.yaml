database:
  name: slidetodiagram
  database_name: slidetodiagram
  user: slidetodiagram_user
  plan: free

services:
  - type: web
    name: slide-to-diagram-backend
    runtime: java
    javaVersion: 21
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/slide-to-diagram-backend-1.0.0.jar
    healthCheckPath: /api/health
    plan: free
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: slidetodiagram
          property: connectionString
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://slide-to-diagram-frontend.vercel.app,http://localhost:5173
